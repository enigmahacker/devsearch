[project]
name = "devsearch"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "anthropic>=1.0",
  "fastapi>=0.115",
  "uvicorn>=0.32",
  "httpx>=0.27",
  "psycopg[binary]>=3.2",
  "redis>=5.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["api/tests", "workers/tests"]
pythonpath = ["."]
